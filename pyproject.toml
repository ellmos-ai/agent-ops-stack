[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ops-stack"
version = "1.3.4"
description = "Local-first coordination layer for multi-agent CLI coding workflows: ticket routing, file locking, decision avatars, shared skills, and MCP control plane"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md", "THIRD_PARTY_LICENSES.txt"]
authors = [
    { name = "ellmos-ai Team", email = "support@ellmos.ai" }
]
keywords = [
    "agent-ops",
    "ellmos-ai",
    "local-first",
    "manifest",
    "mcp",
    "multi-agent",
    "agent-coordination",
    "claude-code",
    "cli-agents",
    "codex-cli",
    "mcp-control-plane",
    "agent-orchestration",
    "ai-agents",
    "developer-tools",
    "file-locking",
    "file-sync",
    "antigravity-cli",
    "offline-first",
    "open-bricks",
    "zero-egress",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/ellmos-ai/agent-ops-stack"
Documentation = "https://github.com/ellmos-ai/agent-ops-stack#readme"
Repository = "https://github.com/ellmos-ai/agent-ops-stack"
Issues = "https://github.com/ellmos-ai/agent-ops-stack/issues"
"Bug Tracker" = "https://github.com/ellmos-ai/agent-ops-stack/issues"
Contributing = "https://github.com/ellmos-ai/agent-ops-stack/blob/main/CONTRIBUTING.md"
Changelog = "https://github.com/ellmos-ai/agent-ops-stack/blob/main/CHANGELOG.md"
Security = "https://github.com/ellmos-ai/agent-ops-stack/blob/main/SECURITY.md"
"Third-Party Licenses" = "https://github.com/ellmos-ai/agent-ops-stack/blob/main/THIRD_PARTY_LICENSES.md"
"Third-Party Licenses (Text)" = "https://github.com/ellmos-ai/agent-ops-stack/blob/main/THIRD_PARTY_LICENSES.txt"
"Level 1 SBOM" = "https://github.com/ellmos-ai/agent-ops-stack/blob/main/THIRD_PARTY_LICENSES.md"
"Level 1 SBOM (Text)" = "https://github.com/ellmos-ai/agent-ops-stack/blob/main/THIRD_PARTY_LICENSES.txt"
"Plain-Text License" = "https://github.com/ellmos-ai/agent-ops-stack/blob/main/LICENSE"
Notice = "https://github.com/ellmos-ai/agent-ops-stack/blob/main/NOTICE"
"Marketing Log" = "https://github.com/ellmos-ai/agent-ops-stack/blob/main/MARKETING-LOG.txt"
"LLM Ready" = "https://github.com/ellmos-ai/agent-ops-stack/blob/main/llms.txt"
"Parent Organization" = "https://github.com/ellmos-ai"
"Umbrella Ecosystem" = "https://github.com/open-bricks"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -v --basetemp=.pytest_temp"
norecursedirs = [".git", ".pytest_cache", ".pytest_temp", ".pytest_tmp*", "__pycache__", "build", "dist", ".venv", ".tox", ".hypothesis", ".turbo", ".nyc_output"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = []

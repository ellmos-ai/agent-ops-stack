[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ops-stack"
version = "1.3.4"
description = "Local-first coordination layer for multi-agent CLI coding workflows: ticket routing, file locking, decision avatars, shared skills, and MCP control plane"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "ellmos-ai Team", email = "support@ellmos.ai" }
]
keywords = [
    "agent-ops",
    "multi-agent",
    "mcp",
    "coordination",
    "local-first",
    "lock-master",
    "ticket-master",
    "sync-master",
    "skills",
    "decision-avatar",
    "manifest",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/ellmos-ai/agent-ops-stack"
Documentation = "https://github.com/ellmos-ai/agent-ops-stack#readme"
Repository = "https://github.com/ellmos-ai/agent-ops-stack"
Issues = "https://github.com/ellmos-ai/agent-ops-stack/issues"
"Bug Tracker" = "https://github.com/ellmos-ai/agent-ops-stack/issues"
Changelog = "https://github.com/ellmos-ai/agent-ops-stack/blob/main/CHANGELOG.md"
Security = "https://github.com/ellmos-ai/agent-ops-stack/blob/main/SECURITY.md"
"Third-Party Licenses" = "https://github.com/ellmos-ai/agent-ops-stack/blob/main/THIRD_PARTY_LICENSES.md"
"Marketing Log" = "https://github.com/ellmos-ai/agent-ops-stack/blob/main/MARKETING-LOG.txt"
"LLM Ready" = "https://github.com/ellmos-ai/agent-ops-stack/blob/main/llms.txt"
"Parent Organization" = "https://github.com/ellmos-ai"
"Umbrella Ecosystem" = "https://github.com/open-bricks"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -v"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = []

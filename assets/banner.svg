<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" role="img" aria-label="agent-ops-stack">
  <title>agent-ops-stack</title>
  <rect x="0" y="0" width="1000" height="240" rx="18" fill="#0f111a"/>
  <rect x="0" y="0" width="6" height="240" fill="#8b5cf6"/>

  <!-- Icon: hub-and-spoke coordination motif -->
  <g transform="translate(60,50)">
    <circle cx="70" cy="70" r="20" fill="#8b5cf6"/>
    <circle cx="10" cy="15" r="10" fill="none" stroke="#38bdf8" stroke-width="5"/>
    <circle cx="130" cy="15" r="10" fill="none" stroke="#38bdf8" stroke-width="5"/>
    <circle cx="10" cy="125" r="10" fill="none" stroke="#f59e0b" stroke-width="5"/>
    <circle cx="130" cy="125" r="10" fill="none" stroke="#f59e0b" stroke-width="5"/>
    <line x1="70" y1="70" x2="16" y2="21" stroke="#8b5cf6" stroke-width="4"/>
    <line x1="70" y1="70" x2="124" y2="21" stroke="#8b5cf6" stroke-width="4"/>
    <line x1="70" y1="70" x2="16" y2="119" stroke="#8b5cf6" stroke-width="4"/>
    <line x1="70" y1="70" x2="124" y2="119" stroke="#8b5cf6" stroke-width="4"/>
  </g>

  <!-- Wordmark + tagline -->
  <text x="248" y="118" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="56" font-weight="700" fill="#ffffff">agent-ops<tspan fill="#8b5cf6">-</tspan>stack</text>
  <text x="251" y="160" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="24" fill="#9ca3af">coordination layer for local CLI coding agents</text>
</svg>
